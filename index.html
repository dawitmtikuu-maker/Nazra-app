<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nazra — Adama Marketplace</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #00b53f;
      --primary-light: #e6f8ec;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 85px;
    }

    header {
      background: var(--surface);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .location-badge {
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .cat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-card.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .cat-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 8px;
      background: #dcfce7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .cat-name {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .cat-count {
      font-size: 11px;
      color: var(--muted);
    }

    .subcat-box {
      background: var(--surface);
      border: 1.5px solid var(--primary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .subcat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .subcat-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subcat-badge {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
    }

    .subcat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .subcat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }

    .subcat-pill.active,
    .subcat-pill:active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .selected-status {
      font-size: 13px;
      color: var(--muted);
      padding: 4px 2px;
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Nazra</div>
    <div class="location-badge">Adama (Nazret)</div>
  </header>

  <div class="container">
    <div class="categories-grid" id="categoriesGrid"></div>

    <div class="subcat-box" id="subcategoriesBox">
      <div class="subcat-header">
        <div class="subcat-title" id="subcatTitle"></div>
        <div class="subcat-badge" id="subcatCount"></div>
      </div>
      <div class="subcat-list" id="subcatList"></div>
    </div>

    <div class="selected-status" id="selectedStatus"></div>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">🏠</span>Home</div>
    <div class="nav-item"><span class="nav-icon">📁</span>Categories</div>
    <div class="nav-item"><span class="nav-icon">➕</span>Post Ad</div>
    <div class="nav-item"><span class="nav-icon">👤</span>Account</div>
  </nav>

  <script>
    const categories = [
      {
        name: "Vehicles",
        icon: "🚗",
        subs: [
          "Cars", "Buses & Microbuses", "Heavy Equipment",
          "Motorcycles & Scooters", "Trucks & Trailers",
          "Vehicle Parts & Accessories", "Watercraft & Boats"
        ]
      },
      {
        name: "Property",
        icon: "🏠",
        subs: [
          "New Builds", "Houses & Apartments for Rent",
          "Houses & Apartments for Sale", "Land & Plots for Rent",
          "Land & Plots for Sale", "Commercial Property for Rent",
          "Commercial Property for Sale",
          "Event Centers, Venues & Workstations", "Short Let"
        ]
      },
      {
        name: "Phones & Tablets",
        icon: "📱",
        subs: [
          "Mobile Phones", "Accessories for Phones & Tablets",
          "Smart Watches & Trackers", "Tablets"
        ]
      },
      {
        name: "Electronics",
        icon: "💻",
        subs: [
          "Accessories & Supplies for Electronics",
          "Audio & Music Equipment", "Computer Accessories",
          "Computer Hardware", "Computer Monitors", "Headphones",
          "Laptops & Computers", "Networking Products",
          "Photo & Video Cameras", "Printers & Scanners",
          "Security & Surveillance", "Software",
          "TV & DVD Equipment", "Video Game Consoles", "Video Games"
        ]
      },
      {
        name: "Home, Furniture & Appliances",
        icon: "🛋️",
        subs: [
          "Furniture", "Garden Supplies", "Home Accessories",
          "Home Appliances", "Kitchen & Dining", "Kitchen Appliances"
        ]
      },
      {
        name: "Fashion",
        icon: "👗",
        subs: [
          "Bags", "Clothing", "Clothing Accessories", "Jewelry",
          "Shoes", "Watches", "Wedding Wear & Accessories"
        ]
      },
      {
        name: "Beauty & Personal Care",
        icon: "💄",
        subs: [
          "Bath & Body", "Fragrance", "Hair Beauty", "Makeup",
          "Sexual Wellness", "Skin Care", "Tools & Accessories",
          "Vitamins & Supplements"
        ]
      },
      {
        name: "Services",
        icon: "🛠️",
        subs: [
          "Automotive Services", "Building & Trade Services",
          "Chauffeur & Airport Transfer Services",
          "Child Care & Education Services", "Cleaning Services",
          "Computer & IT Services", "DJ & Entertainment Services",
          "Fitness & Personal Training Services",
          "Health & Beauty Services", "Laundry Services",
          "Legal Services", "Logistics Services",
          "Manufacturing Services",
          "Party, Catering & Event Services",
          "Photography & Video Services", "Printing Services",
          "Recruitment Services", "Repair Services",
          "Tax & Financial Services", "Travel Agents & Tours",
          "Wedding Venues & Services"
        ]
      },
      {
        name: "Jobs",
        icon: "💼",
        subs: [
          "Accounting & Finance Jobs", "Advertising & Marketing Jobs",
          "Arts & Entertainment Jobs", "Childcare & Babysitting Jobs",
          "Clerical & Administrative Jobs", "Computing & IT Jobs",
          "Construction & Skilled Trade Jobs",
          "Consulting & Strategy Jobs", "Customer Service Jobs",
          "Driver Jobs", "Engineering & Architecture Jobs",
          "Farming & Veterinary Jobs", "Gardening & Landscaping Jobs",
          "Health & Beauty Jobs", "Healthcare & Nursing Jobs",
          "Hotel Jobs", "Housekeeping & Cleaning Jobs",
          "Human Resources Jobs", "Internship Jobs", "Legal Jobs",
          "Logistics & Transportation Jobs", "Management Jobs",
          "Manufacturing Jobs", "Office Jobs",
          "Part-Time & Weekend Jobs",
          "Quality Control & Assurance Jobs",
          "Research & Survey Jobs", "Restaurant & Bar Jobs",
          "Retail Jobs", "Sales & Telemarketing Jobs",
          "Security Jobs", "Sports Club Jobs", "Teaching Jobs",
          "Travel & Tourism Jobs"
        ]
      },
      {
        name: "Babies & Kids",
        icon: "🧸",
        subs: [
          "Baby & Child Care", "Baby & Kids' Accessories",
          "Children's Clothing", "Children's Furniture",
          "Children's Gear & Safety", "Children's Shoes",
          "Maternity & Pregnancy", "Playground Equipment",
          "Prams & Strollers", "Toys"
        ]
      },
      {
        name: "Animals & Pets",
        icon: "🐾",
        subs: [
          "Birds", "Cats & Kittens", "Dogs & Puppies", "Fish",
          "Other Animals", "Pet Accessories", "Reptiles"
        ]
      },
      {
        name: "Agriculture & Food",
        icon: "🌾",
        subs: [
          "Farm Animals", "Farm Machinery & Equipment",
          "Feeds, Supplements & Seeds", "Food & Beverages",
          "Livestock & Poultry"
        ]
      },
      {
        name: "Commercial Equipment & Tools",
        icon: "🏭",
        subs: [
          "Industrial Ovens", "Manufacturing Equipment",
          "Manufacturing Materials & Tools",
          "Medical Supplies & Equipment", "Printing Equipment",
          "Restaurant & Catering Equipment",
          "Safetywear & Equipment", "Salon Equipment",
          "Stage & Event Equipment", "Stationery", "Store Equipment"
        ]
      },
      {
        name: "Repair & Construction",
        icon: "🧱",
        subs: [
          "Building Materials", "Doors", "Electrical Equipment",
          "Electrical Hand Tools", "Hand Tools",
          "Measuring & Layout Tools", "Plumbing & Water Supply",
          "Solar Energy", "Windows"
        ]
      },
      {
        name: "Sports, Arts & Outdoors",
        icon: "⚽",
        subs: [
          "Arts & Crafts", "Books & Games", "Camping Gear",
          "CDs & DVDs", "Musical Instruments & Gear",
          "Sports Equipment"
        ]
      }
    ];

    let selectedIndex = 0;
    let selectedSub = "";

    const gridEl = document.getElementById("categoriesGrid");
    const subcatBoxEl = document.getElementById("subcategoriesBox");
    const subcatTitleEl = document.getElementById("subcatTitle");
    const subcatCountEl = document.getElementById("subcatCount");
    const subcatListEl = document.getElementById("subcatList");
    const statusEl = document.getElementById("selectedStatus");

    function renderGrid() {
      gridEl.innerHTML = "";
      categories.forEach((cat, idx) => {
        const card = document.createElement("div");
        card.className = "cat-card" + (idx === selectedIndex ? " active" : "");
        card.innerHTML = `
          <div class="cat-icon">${cat.icon}</div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-count">${cat.subs.length} types</div>
        `;
        card.onclick = () => {
          selectedIndex = idx;
          selectedSub = "";
          renderGrid();
          renderSubcategories();
          subcatBoxEl.scrollIntoView({ behavior: "smooth", block: "center" });
        };
        gridEl.appendChild(card);
      });
    }

    function renderSubcategories() {
      const cat = categories[selectedIndex];
      subcatTitleEl.textContent = `${cat.icon} ${cat.name}`;
      subcatCountEl.textContent = `${cat.subs.length} subcategories`;
      subcatListEl.innerHTML = "";

      cat.subs.forEach((sub) => {
        const pill = document.createElement("div");
        pill.className = "subcat-pill" + (sub === selectedSub ? " active" : "");
        pill.textContent = sub;
        pill.onclick = () => {
          selectedSub = sub;
          renderSubcategories();
        };
        subcatListEl.appendChild(pill);
      });

      statusEl.textContent = selectedSub
        ? `Selected: ${cat.name} → ${selectedSub}`
        : `Selected category: ${cat.name}`;
    }

    renderGrid();
    renderSubcategories();
  </script>
</body>
</html>
