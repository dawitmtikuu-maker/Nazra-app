<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nazra — Adama Marketplace</title>
  <style>
    :root {
      --bg: #f2f4f7;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #00b53f;
      --primary-dark: #009433;
      --primary-light: #e6f8ec;
      --border: #e5e7eb;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 76px;
    }

    /* Jiji Green Top Bar */
    .top-bar {
      background: var(--primary);
      color: #fff;
      padding: 12px 14px 14px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .location-pill {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .clear-btn {
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Categories Grid */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
    }

    .cat-card.active {
      background: var(--primary-light);
      border-color: var(--primary);
    }

    .cat-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .cat-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .cat-count {
      font-size: 10.5px;
      color: var(--muted);
    }

    /* Subcategories Drawer */
    .subcat-box {
      background: var(--surface);
      border: 1.5px solid var(--primary);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .subcat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .subcat-title {
      font-size: 15px;
      font-weight: 800;
    }

    .reset-filter {
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
    }

    .subcat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .subcat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .subcat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Section Header */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Ads Grid (Jiji 2-Column Feed) */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .ad-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .ad-img {
      height: 120px;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      position: relative;
    }

    .ad-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fav-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
    }

    .ad-body {
      padding: 9px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ad-price {
      color: var(--primary);
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .ad-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ad-meta {
      font-size: 11px;
      color: var(--muted);
    }

    /* Forms & Views */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .form-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modal for Ad Details */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      border-radius: 18px 18px 0 0;
      padding: 18px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .close-modal {
      background: var(--bg);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 18px;
      cursor: pointer;
    }

    .call-btn {
      display: block;
      text-align: center;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      padding: 13px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      margin-top: 14px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 7px 0;
      z-index: 40;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 19px;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-row">
      <div class="logo">Nazra</div>
      <div class="location-pill">📍 Adama (Nazret)</div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search phones, cars, jobs in Adama..." />
      <button class="clear-btn" id="clearSearchBtn">Reset</button>
    </div>
  </div>

  <div class="container">
    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
      <div class="categories-grid" id="categoriesGrid"></div>

      <div class="subcat-box" id="subcategoriesBox" style="display:none;">
        <div class="subcat-header">
          <div class="subcat-title" id="subcatTitle"></div>
          <button class="reset-filter" id="showAllBtn">Show All Ads</button>
        </div>
        <div class="subcat-list" id="subcatList"></div>
      </div>

      <div class="section-title">
        <span id="feedHeading">Trending in Adama</span>
        <span id="adCountLabel" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <div class="ads-grid" id="adsGrid"></div>
    </div>

    <!-- POST AD VIEW -->
    <div id="view-post" class="view">
      <div class="form-card">
        <div class="section-title">Post a New Ad</div>
        <form id="postAdForm">
          <div class="form-group">
            <label>Category</label>
            <select id="postCategory" required></select>
          </div>
          <div class="form-group">
            <label>Subcategory</label>
            <select id="postSubcategory" required></select>
          </div>
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="postTitle" placeholder="e.g. Samsung Galaxy S21 Ultra 5G" required />
          </div>
          <div class="form-group">
            <label>Price (ETB)</label>
            <input type="number" id="postPrice" placeholder="e.g. 38000" required />
          </div>
          <div class="form-group">
            <label>Condition</label>
            <select id="postCondition">
              <option value="Brand New">Brand New</option>
              <option value="Used - Like New">Used - Like New</option>
              <option value="Used">Used</option>
            </select>
          </div>
          <div class="form-group">
            <label>Area in Adama</label>
            <input type="text" id="postArea" value="Adama — Bole / Franko" required />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="postPhone" placeholder="09XXXXXXXX" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="postDesc" rows="3" placeholder="Write details about your item..."></textarea>
          </div>
          <button type="submit" class="btn-primary">Publish Ad</button>
        </form>
      </div>
    </div>

    <!-- SAVED VIEW -->
    <div id="view-saved" class="view">
      <div class="section-title">Saved Ads</div>
      <div class="ads-grid" id="savedGrid"></div>
    </div>

    <!-- MY ADS / MANAGE VIEW -->
    <div id="view-myads" class="view">
      <div class="section-title">
        <span>Manage / Delete Ads</span>
      </div>
      <div id="manageList"></div>
    </div>
  </div>

  <!-- Ad Detail Bottom Sheet -->
  <div class="modal-backdrop" id="adModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div id="modalCat" style="font-size:12px;font-weight:700;color:var(--primary);"></div>
        <button class="close-modal" id="closeModalBtn">✕</button>
      </div>
      <div id="modalImg" style="height:170px;background:#f3f4f6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:12px;"></div>
      <div id="modalPrice" style="font-size:20px;font-weight:900;color:var(--primary);margin-bottom:4px;"></div>
      <div id="modalTitle" style="font-size:17px;font-weight:800;margin-bottom:6px;"></div>
      <div id="modalMeta" style="font-size:12.5px;color:var(--muted);margin-bottom:12px;"></div>
      <div id="modalDesc" style="font-size:14px;line-height:1.45;background:var(--bg);padding:12px;border-radius:10px;"></div>
      <a id="modalCallBtn" class="call-btn" href="#">📞 Call Seller</a>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span>Home</div>
    <div class="nav-item" data-tab="post"><span class="nav-icon">➕</span>Post Ad</div>
    <div class="nav-item" data-tab="saved"><span class="nav-icon">❤️</span>Saved</div>
    <div class="nav-item" data-tab="myads"><span class="nav-icon">🗂️</span>My Ads</div>
  </nav>

  <script>
    const categories = [
      {
        name: "Vehicles", icon: "🚗",
        subs: ["Cars", "Buses & Microbuses", "Heavy Equipment", "Motorcycles & Scooters", "Trucks & Trailers", "Vehicle Parts & Accessories", "Watercraft & Boats"]
      },
      {
        name: "Property", icon: "🏠",
        subs: ["New Builds", "Houses & Apartments for Rent", "Houses & Apartments for Sale", "Land & Plots for Rent", "Land & Plots for Sale", "Commercial Property for Rent", "Commercial Property for Sale", "Event Centers, Venues & Workstations", "Short Let"]
      },
      {
        name: "Phones & Tablets", icon: "📱",
        subs: ["Mobile Phones", "Accessories for Phones & Tablets", "Smart Watches & Trackers", "Tablets"]
      },
      {
        name: "Electronics", icon: "💻",
        subs: ["Accessories & Supplies for Electronics", "Audio & Music Equipment", "Computer Accessories", "Computer Hardware", "Computer Monitors", "Headphones", "Laptops & Computers", "Networking Products", "Photo & Video Cameras", "Printers & Scanners", "Security & Surveillance", "Software", "TV & DVD Equipment", "Video Game Consoles", "Video Games"]
      },
      {
        name: "Home, Furniture & Appliances", icon: "🛋️",
        subs: ["Furniture", "Garden Supplies", "Home Accessories", "Home Appliances", "Kitchen & Dining", "Kitchen Appliances"]
      },
      {
        name: "Fashion", icon: "👗",
        subs: ["Bags", "Clothing", "Clothing Accessories", "Jewelry", "Shoes", "Watches", "Wedding Wear & Accessories"]
      },
      {
        name: "Beauty & Personal Care", icon: "💄",
        subs: ["Bath & Body", "Fragrance", "Hair Beauty", "Makeup", "Sexual Wellness", "Skin Care", "Tools & Accessories", "Vitamins & Supplements"]
      },
      {
        name: "Services", icon: "🛠️",
        subs: ["Automotive Services", "Building & Trade Services", "Chauffeur & Airport Transfer Services", "Child Care & Education Services", "Cleaning Services", "Computer & IT Services", "DJ & Entertainment Services", "Fitness & Personal Training Services", "Health & Beauty Services", "Laundry Services", "Legal Services", "Logistics Services", "Manufacturing Services", "Party, Catering & Event Services", "Photography & Video Services", "Printing Services", "Recruitment Services", "Repair Services", "Tax & Financial Services", "Travel Agents & Tours", "Wedding Venues & Services"]
      },
      {
        name: "Jobs", icon: "💼",
        subs: ["Accounting & Finance Jobs", "Advertising & Marketing Jobs", "Arts & Entertainment Jobs", "Childcare & Babysitting Jobs", "Clerical & Administrative Jobs", "Computing & IT Jobs", "Construction & Skilled Trade Jobs", "Consulting & Strategy Jobs", "Customer Service Jobs", "Driver Jobs", "Engineering & Architecture Jobs", "Farming & Veterinary Jobs", "Gardening & Landscaping Jobs", "Health & Beauty Jobs", "Healthcare & Nursing Jobs", "Hotel Jobs", "Housekeeping & Cleaning Jobs", "Human Resources Jobs", "Internship Jobs", "Legal Jobs", "Logistics & Transportation Jobs", "Management Jobs", "Manufacturing Jobs", "Office Jobs", "Part-Time & Weekend Jobs", "Quality Control & Assurance Jobs", "Research & Survey Jobs", "Restaurant & Bar Jobs", "Retail Jobs", "Sales & Telemarketing Jobs", "Security Jobs", "Sports Club Jobs", "Teaching Jobs", "Travel & Tourism Jobs"]
      },
      {
        name: "Babies & Kids", icon: "🧸",
        subs: ["Baby & Child Care", "Baby & Kids' Accessories", "Children's Clothing", "Children's Furniture", "Children's Gear & Safety", "Children's Shoes", "Maternity & Pregnancy", "Playground Equipment", "Prams & Strollers", "Toys"]
      },
      {
        name: "Animals & Pets", icon: "🐾",
        subs: ["Birds", "Cats & Kittens", "Dogs & Puppies", "Fish", "Other Animals", "Pet Accessories", "Reptiles"]
      },
      {
        name: "Agriculture & Food", icon: "🌾",
        subs: ["Farm Animals", "Farm Machinery & Equipment", "Feeds, Supplements & Seeds", "Food & Beverages", "Livestock & Poultry"]
      },
      {
        name: "Commercial Equipment & Tools", icon: "🏭",
        subs: ["Industrial Ovens", "Manufacturing Equipment", "Manufacturing Materials & Tools", "Medical Supplies & Equipment", "Printing Equipment", "Restaurant & Catering Equipment", "Safetywear & Equipment", "Salon Equipment", "Stage & Event Equipment", "Stationery", "Store Equipment"]
      },
      {
        name: "Repair & Construction", icon: "🧱",
        subs: ["Building Materials", "Doors", "Electrical Equipment", "Electrical Hand Tools", "Hand Tools", "Measuring & Layout Tools", "Plumbing & Water Supply", "Solar Energy", "Windows"]
      },
      {
        name: "Sports, Arts & Outdoors", icon: "⚽",
        subs: ["Arts & Crafts", "Books & Games", "Camping Gear", "CDs & DVDs", "Musical Instruments & Gear", "Sports Equipment"]
      }
    ];

    const defaultAds = [
      {
        id: 1,
        category: "Phones & Tablets",
        subcategory: "Mobile Phones",
        title: "Samsung Galaxy S21 Ultra 5G (12GB/256GB)",
        price: 42000,
        condition: "Used - Like New",
        area: "Adama — Posta Bet",
        phone: "0911000001",
        icon: "📱",
        desc: "Clean original Samsung Galaxy S21 Ultra 5G, no screen shadow, strong battery."
      },
      {
        id: 2,
        category: "Phones & Tablets",
        subcategory: "Mobile Phones",
        title: "iPhone 13 Pro 128GB Sierra Blue",
        price: 58000,
        condition: "Used - Like New",
        area: "Adama — Franko",
        phone: "0911000002",
        icon: "📲",
        desc: "Factory unlocked, 89% battery health, clean body."
      },
      {
        id: 3,
        category: "Vehicles",
        subcategory: "Cars",
        title: "Toyota Vitz 2015 Compact Automatic",
        price: 1450000,
        condition: "Used",
        area: "Adama — Bole",
        phone: "0911000003",
        icon: "🚗",
        desc: "Well-maintained engine, low fuel consumption, Plate 2."
      },
      {
        id: 4,
        category: "Electronics",
        subcategory: "Video Game Consoles",
        title: "PlayStation 5 Disc Edition + 2 Controllers",
        price: 68000,
        condition: "Used - Like New",
        area: "Adama — Mebrat Hayl",
        phone: "0911000004",
        icon: "🎮",
        desc: "Includes FC 25 and GTA V, original cables included."
      }
    ];

    let ads = JSON.parse(localStorage.getItem("nazra_ads")) || defaultAds;
    let savedIds = JSON.parse(localStorage.getItem("nazra_saved")) || [];
    let selectedCategory = "";
    let selectedSubcategory = "";
    let searchQuery = "";

    function saveData() {
      localStorage.setItem("nazra_ads", JSON.stringify(ads));
      localStorage.setItem("nazra_saved", JSON.stringify(savedIds));
    }

    function renderCategories() {
      const grid = document.getElementById("categoriesGrid");
      grid.innerHTML = "";
      categories.forEach((cat) => {
        const card = document.createElement("div");
        card.className = "cat-card" + (selectedCategory === cat.name ? " active" : "");
        card.innerHTML = `
          <div class="cat-icon">${cat.icon}</div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-count">${cat.subs.length} types</div>
        `;
        card.onclick = () => {
          selectedCategory = cat.name;
          selectedSubcategory = "";
          renderCategories();
          renderSubcategories();
          renderAds();
          document.getElementById("subcategoriesBox").scrollIntoView({ behavior: "smooth", block: "center" });
        };
        grid.appendChild(card);
      });
    }

    function renderSubcategories() {
      const box = document.getElementById("subcategoriesBox");
      if (!selectedCategory) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      const cat = categories.find((c) => c.name === selectedCategory);
      document.getElementById("subcatTitle").textContent = `${cat.icon} ${cat.name}`;
      const list = document.getElementById("subcatList");
      list.innerHTML = "";

      cat.subs.forEach((sub) => {
        const pill = document.createElement("div");
        pill.className = "subcat-pill" + (selectedSubcategory === sub ? " active" : "");
        pill.textContent = sub;
        pill.onclick = () => {
          selectedSubcategory = selectedSubcategory === sub ? "" : sub;
          renderSubcategories();
          renderAds();
        };
        list.appendChild(pill);
      });
    }

    function createAdCard(ad) {
      const isSaved = savedIds.includes(ad.id);
      const card = document.createElement("div");
      card.className = "ad-card";
      card.innerHTML = `
        <div class="ad-img">
          <span>${ad.icon || "📦"}</span>
          <button class="fav-btn" title="Save">${isSaved ? "❤️" : "🤍"}</button>
        </div>
        <div class="ad-body">
          <div>
            <div class="ad-price">ETB ${Number(ad.price).toLocaleString()}</div>
            <div class="ad-title">${ad.title}</div>
          </div>
          <div class="ad-meta">${ad.area}</div>
        </div>
      `;

      card.querySelector(".fav-btn").onclick = (e) => {
        e.stopPropagation();
        if (savedIds.includes(ad.id)) {
          savedIds = savedIds.filter((id) => id !== ad.id);
        } else {
          savedIds.push(ad.id);
        }
        saveData();
        renderAds();
        renderSaved();
      };

      card.onclick = () => openModal(ad);
      return card;
    }

    function renderAds() {
      const grid = document.getElementById("adsGrid");
      const filtered = ads.filter((ad) => {
        const matchCat = !selectedCategory || ad.category === selectedCategory;
        const matchSub = !selectedSubcategory || ad.subcategory === selectedSubcategory;
        const q = searchQuery.toLowerCase();
        const matchSearch =
          !q ||
          ad.title.toLowerCase().includes(q) ||
          ad.category.toLowerCase().includes(q) ||
          ad.subcategory.toLowerCase().includes(q) ||
          ad.area.toLowerCase().includes(q);
        return matchCat && matchSub && matchSearch;
      });

      document.getElementById("feedHeading").textContent = selectedSubcategory
        ? selectedSubcategory
        : selectedCategory
        ? selectedCategory
        : "Trending in Adama";
      document.getElementById("adCountLabel").textContent = `${filtered.length} ads`;

      grid.innerHTML = "";
      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);">No ads found here yet. Tap <b>Post Ad</b> below to add one!</div>`;
        return;
      }
      filtered.forEach((ad) => grid.appendChild(createAdCard(ad)));
    }

    function renderSaved() {
      const grid = document.getElementById("savedGrid");
      const savedAds = ads.filter((ad) => savedIds.includes(ad.id));
      grid.innerHTML = "";
      if (savedAds.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);">No saved ads yet. Tap ❤️ on any item.</div>`;
        return;
      }
      savedAds.forEach((ad) => grid.appendChild(createAdCard(ad)));
    }

    function renderManageAds() {
      const list = document.getElementById("manageList");
      list.innerHTML = "";
      if (ads.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--muted);">No ads available.</div>`;
        return;
      }
      ads.forEach((ad) => {
        const row = document.createElement("div");
        row.style.cssText = "background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
        row.innerHTML = `
          <div>
            <div style="font-weight:700;font-size:13.5px;">${ad.icon || "📦"} ${ad.title}</div>
            <div style="font-size:12px;color:var(--primary);font-weight:700;">ETB ${Number(ad.price).toLocaleString()}</div>
            <div style="font-size:11px;color:var(--muted);">${ad.category} → ${ad.subcategory}</div>
          </div>
          <button class="btn-danger">Delete</button>
        `;
        row.querySelector(".btn-danger").onclick = () => {
          ads = ads.filter((item) => item.id !== ad.id);
          saveData();
          renderManageAds();
          renderAds();
          renderSaved();
        };
        list.appendChild(row);
      });
    }

    function openModal(ad) {
      document.getElementById("modalCat").textContent = `${ad.category} • ${ad.subcategory}`;
      document.getElementById("modalImg").textContent = ad.icon || "📦";
      document.getElementById("modalPrice").textContent = `ETB ${Number(ad.price).toLocaleString()}`;
      document.getElementById("modalTitle").textContent = ad.title;
      document.getElementById("modalMeta").textContent = `${ad.condition} • ${ad.area}`;
      document.getElementById("modalDesc").textContent = ad.desc || "Contact seller for more details.";
      const callBtn = document.getElementById("modalCallBtn");
      callBtn.href = `tel:${ad.phone}`;
      callBtn.textContent = `📞 Call Seller (${ad.phone})`;
      document.getElementById("adModal").classList.add("open");
    }

    document.getElementById("closeModalBtn").onclick = () => {
      document.getElementById("adModal").classList.remove("open");
    };

    document.getElementById("adModal").onclick = (e) => {
      if (e.target.id === "adModal") {
        document.getElementById("adModal").classList.remove("open");
      }
    };

    // Search & Reset
    document.getElementById("searchInput").oninput = (e) => {
      searchQuery = e.target.value;
      renderAds();
    };

    document.getElementById("clearSearchBtn").onclick = () => {
      searchQuery = "";
      selectedCategory = "";
      selectedSubcategory = "";
      document.getElementById("searchInput").value = "";
      renderCategories();
      renderSubcategories();
      renderAds();
    };

    document.getElementById("showAllBtn").onclick = () => {
      selectedCategory = "";
      selectedSubcategory = "";
      renderCategories();
      renderSubcategories();
      renderAds();
    };

    // Populate Post Ad Dropdowns
    const postCatSelect = document.getElementById("postCategory");
    const postSubSelect = document.getElementById("postSubcategory");

    categories.forEach((cat) => {
      const opt = document.createElement("option");
      opt.value = cat.name;
      opt.textContent = `${cat.icon} ${cat.name}`;
      postCatSelect.appendChild(opt);
    });

    function updatePostSubcategories() {
      const cat = categories.find((c) => c.name === postCatSelect.value);
      postSubSelect.innerHTML = "";
      cat.subs.forEach((sub) => {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.textContent = sub;
        postSubSelect.appendChild(opt);
      });
    }
    postCatSelect.onchange = updatePostSubcategories;
    updatePostSubcategories();

    document.getElementById("postAdForm").onsubmit = (e) => {
      e.preventDefault();
      const catObj = categories.find((c) => c.name === postCatSelect.value);
      const newAd = {
        id: Date.now(),
        category: postCatSelect.value,
        subcategory: postSubSelect.value,
        title: document.getElementById("postTitle").value.trim(),
        price: Number(document.getElementById("postPrice").value),
        condition: document.getElementById("postCondition").value,
        area: document.getElementById("postArea").value.trim(),
        phone: document.getElementById("postPhone").value.trim(),
        icon: catObj ? catObj.icon : "📦",
        desc: document.getElementById("postDesc").value.trim()
      };
      ads.unshift(newAd);
      saveData();
      e.target.reset();
      updatePostSubcategories();
      switchTab("home");
      renderAds();
    };

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n.dataset.tab === tab));
      document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
      document.getElementById(`view-${tab}`).classList.add("active");
      if (tab === "saved") renderSaved();
      if (tab === "myads") renderManageAds();
    }

    document.querySelectorAll(".nav-item").forEach((item) => {
      item.onclick = () => switchTab(item.dataset.tab);
    });

    // Initial Render
    renderCategories();
    renderAds();
  </script>
</body>
</html>
