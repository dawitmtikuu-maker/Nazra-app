<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f5132" />
  <title>Nazra - የአዳማ እና ክልል ከተሞች ማርኬትፕሌስ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f2f5f3;
      color: #17261e;
      padding-bottom: 76px;
    }

    /* Top Bar */
    .topbar {
      background: #0f5132;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 9px;
      background: #20c997; color: #08291a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px;
    }
    .brand-name { font-size: 20px; font-weight: 800; letter-spacing: 0.3px; }
    .brand-sub { font-size: 11px; opacity: 0.85; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-btn {
      background: rgba(255,255,255,0.14);
      color: #fff; border: 1px solid rgba(255,255,255,0.28);
      padding: 7px 10px; border-radius: 8px; font-size: 12px;
      font-weight: 700; cursor: pointer;
    }
    .btn-post {
      background: #20c997; color: #072618; border: none;
      padding: 8px 13px; border-radius: 8px; font-weight: 800;
      font-size: 13px; cursor: pointer;
    }

    /* Hero & Promo Banner */
    .hero {
      background: linear-gradient(150deg, #0f5132 0%, #198754 100%);
      color: #fff;
      padding: 18px 16px 24px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    .promo-strip {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .promo-pill {
      background: #ffc107; color: #1b1b1b;
      padding: 3px 8px; border-radius: 999px;
      font-weight: 800; font-size: 11px; white-space: nowrap;
    }
    .hero h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; }
    .hero p { margin: 0 0 14px; font-size: 13.5px; opacity: 0.92; }

    .search-panel {
      background: #fff; color: #17261e;
      padding: 12px; border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      display: flex; flex-direction: column; gap: 10px;
    }
    .search-row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea {
      width: 100%; padding: 11px 12px;
      border: 1px solid #d4dcd7; border-radius: 10px;
      font-size: 14px; background: #fff; color: #17261e;
    }
    .search-row > * { flex: 1 1 150px; }

    /* Categories */
    .section { padding: 16px; }
    .section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .section-title { margin: 0; font-size: 17px; font-weight: 800; }
    .count-badge {
      background: #e1efe7; color: #0f5132;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .cats {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 6px; scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-chip {
      border: 1px solid #cdd8d2; background: #fff; color: #1f3328;
      padding: 8px 13px; border-radius: 999px; font-size: 13px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .cat-chip.active {
      background: #0f5132; color: #fff; border-color: #0f5132;
    }

    /* Ad Cards */
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
      border: 1px solid #e7ece9;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .tag {
      background: #eef6f1; color: #0f5132;
      padding: 4px 9px; border-radius: 8px;
      font-size: 11.5px; font-weight: 700; white-space: nowrap;
    }
    .featured-tag {
      background: #fff4d6; color: #8a5a00;
      padding: 4px 8px; border-radius: 8px;
      font-size: 11px; font-weight: 800; white-space: nowrap;
    }
    .ad-title { font-size: 16px; font-weight: 800; margin: 4px 0; }
    .ad-price { font-size: 18px; font-weight: 800; color: #0f5132; }
    .ad-meta { font-size: 12.5px; color: #526059; line-height: 1.45; }
    .card-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-call {
      flex: 1; text-align: center; text-decoration: none;
      background: #0f5132; color: #fff; padding: 9px 12px;
      border-radius: 9px; font-weight: 700; font-size: 13px;
    }
    .btn-tg {
      text-align: center; text-decoration: none;
      background: #e7f3ff; color: #0b5ed7; padding: 9px 12px;
      border-radius: 9px; font-weight: 700; font-size: 13px;
    }

    /* Modal */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 60;
      justify-content: center; align-items: center; padding: 16px;
    }
    .modal {
      background: #fff; width: 100%; max-width: 440px;
      padding: 18px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin: 0 0 4px; font-size: 18px; }
    .modal-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-save {
      flex: 1; background: #0f5132; color: #fff; border: none;
      padding: 11px; border-radius: 10px; font-weight: 800; cursor: pointer;
    }
    .btn-close {
      background: #e9ecef; color: #212529; border: none;
      padding: 11px 14px; border-radius: 10px; font-weight: 700; cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid #dfe6e2;
      display: flex; justify-content: space-around; padding: 8px 6px;
      z-index: 20;
    }
    .nav-btn {
      background: none; border: none; color: #526059;
      font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 4px 10px; border-radius: 8px;
    }
    .nav-btn.active { color: #0f5132; background: #eef6f1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">N</div>
      <div>
        <div class="brand-name">Nazra</div>
        <div class="brand-sub" id="subLabel">አዳማ እና አካባቢ</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
      <button class="btn-post" id="postBtn" onclick="openModal()">+ ለጥፍ</button>
    </div>
  </header>

  <section class="hero">
    <div class="promo-strip">
      <span id="promoText">📍 ለአዳማ፣ ቢሾፍቱ፣ ሞጆ፣ አሰላ እና ሻሸመኔ ነዋሪዎች የተዘጋጀ</span>
      <span class="promo-pill">LIVE</span>
    </div>
    <h1 id="heroTitle">የአዳማ እና ክልል ከተሞች ማርኬትፕሌስ</h1>
    <p id="heroDesc">ስልኮች፣ መኪኖች፣ ቤቶች እና ሌሎች እቃዎችን በቀላሉ ይግዙ፣ ይሽጡ እና በቀጥታ ይደውሉ።</p>

    <div class="search-panel">
      <input id="searchInput" type="text" placeholder="ምን ይፈልጋሉ? (ለምሳሌ፡ iPhone, Corolla, ቤት...)" oninput="renderAds()" />
      <div class="search-row">
        <select id="cityFilter" onchange="renderAds()">
          <option value="ALL">ሁሉም ከተሞች (All Cities)</option>
          <option value="Adama (አዳማ)">Adama (አዳማ)</option>
          <option value="Bishoftu (ቢሾፍቱ)">Bishoftu (ቢሾፍቱ)</option>
          <option value="Mojo (ሞጆ)">Mojo (ሞጆ)</option>
          <option value="Asella (አሰላ)">Asella (አሰላ)</option>
          <option value="Shashamane (ሻሸመኔ)">Shashamane (ሻሸመኔ)</option>
        </select>
        <select id="sortFilter" onchange="renderAds()">
          <option value="newest">አዲስ የተለጠፉ</option>
          <option value="low">ዝቅተኛ ዋጋ</option>
          <option value="high">ከፍተኛ ዋጋ</option>
        </select>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="cats" id="categoryChips">
      <button class="cat-chip active" data-cat="ALL" onclick="selectCat('ALL', this)">ሁሉም</button>
      <button class="cat-chip" data-cat="Phones" onclick="selectCat('Phones', this)">📱 ስልኮች</button>
      <button class="cat-chip" data-cat="Cars" onclick="selectCat('Cars', this)">🚗 መኪኖች</button>
      <button class="cat-chip" data-cat="Electronics" onclick="selectCat('Electronics', this)">💻 ኤሌክትሮኒክስ</button>
      <button class="cat-chip" data-cat="Home" onclick="selectCat('Home', this)">🏠 የቤት እቃ</button>
      <button class="cat-chip" data-cat="Other" onclick="selectCat('Other', this)">📦 ሌሎች</button>
    </div>
  </section>

  <section class="section" style="padding-top: 4px;">
    <div class="section-head">
      <h2 class="section-title" id="adsHeading">ማስታወቂያዎች</h2>
      <span class="count-badge" id="adsCount">0</span>
    </div>
    <div class="grid" id="adsGrid"></div>
  </section>

  <div class="modal-bg" id="adModal">
    <div class="modal">
      <h3 id="modalTitle">አዲስ ማስታወቂያ ይለጥፉ</h3>
      <input id="adTitle" type="text" placeholder="የዕቃው ስም (ለምሳሌ፡ Samsung Galaxy S24)" />
      <input id="adPrice" type="number" placeholder="ዋጋ በብር (ETB)" />
      <select id="adCategory">
        <option value="Phones">ስልኮች (Phones)</option>
        <option value="Cars">መኪኖች (Cars)</option>
        <option value="Electronics">ኤሌክትሮኒክስ (Electronics)</option>
        <option value="Home">የቤት እቃ (Home)</option>
        <option value="Other">ሌሎች (Other)</option>
      </select>
      <select id="adCity">
        <option value="Adama (አዳማ)">Adama (አዳማ)</option>
        <option value="Bishoftu (ቢሾፍቱ)">Bishoftu (ቢሾፍቱ)</option>
        <option value="Mojo (ሞጆ)">Mojo (ሞጆ)</option>
        <option value="Asella (አሰላ)">Asella (አሰላ)</option>
        <option value="Shashamane (ሻሸመኔ)">Shashamane (ሻሸመኔ)</option>
      </select>
      <input id="adPhone" type="tel" placeholder="ስልክ ቁጥር (ለምሳሌ፡ 0911000000)" />
      <input id="adTelegram" type="text" placeholder="Telegram username (አማራጭ፣ ያለ @)" />
      <textarea id="adNote" rows="2" placeholder="ተጨማሪ ማብራሪያ (ሁኔታ፣ ቦታ፣ ወዘተ...)"></textarea>
      <div class="modal-row">
        <button class="btn-save" onclick="addAd()">ለጥፍ / Publish</button>
        <button class="btn-close" onclick="closeModal()">ዝጋ</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome" onclick="setTab('home')">
      <span>🏠</span>
      <span id="navHomeLabel">መነሻ</span>
    </button>
    <button class="nav-btn" id="navAdama" onclick="setTab('adama')">
      <span>📍</span>
      <span>አዳማ</span>
    </button>
    <button class="nav-btn" id="navPost" onclick="openModal()">
      <span>➕</span>
      <span id="navPostLabel">ለጥፍ</span>
    </button>
  </nav>

  <script>
    const STORAGE_KEY = "nazra_marketplace_v1";
    let lang = "am";
    let activeCat = "ALL";

    const sampleAds = [
      {
        id: 1,
        title: "iPhone 15 Pro Max (256GB)",
        price: 118000,
        category: "Phones",
        city: "Adama (አዳማ)",
        phone: "0911223344",
        telegram: "nazra_adama",
        note: "ንጹህ፣ ባትሪ 96%፣ አዳማ መሃል ይገኛል።",
        featured: true
      },
      {
        id: 2,
        title: "Toyota Corolla 2016",
        price: 1950000,
        category: "Cars",
        city: "Adama (አዳማ)",
        phone: "0911556677",
        telegram: "",
        note: "አውቶማቲክ፣ ጥሩ ሁኔታ ላይ ያለ።",
        featured: true
      },
      {
        id: 3,
        title: "Samsung Galaxy A55 5G",
        price: 34500,
        category: "Phones",
        city: "Bishoftu (ቢሾፍቱ)",
        phone: "0912889900",
        telegram: "",
        note: "አዲስ ታሽጎ ያለ፣ ዋስትና አለው።",
        featured: false
      }
    ];

    let ads = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!Array.isArray(ads) || ads.length === 0) {
      ads = sampleAds;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ads));
    }

    function saveAds() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ads));
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function selectCat(cat, el) {
      activeCat = cat;
      document.querySelectorAll(".cat-chip").forEach(btn => btn.classList.remove("active"));
      if (el) el.classList.add("active");
      renderAds();
    }

    function setTab(tab) {
      document.getElementById("navHome").classList.toggle("active", tab === "home");
      document.getElementById("navAdama").classList.toggle("active", tab === "adama");
      if (tab === "adama") {
        document.getElementById("cityFilter").value = "Adama (አዳማ)";
      } else {
        document.getElementById("cityFilter").value = "ALL";
      }
      renderAds();
    }

    function toggleLang() {
      lang = lang === "am" ? "en" : "am";
      const isEn = lang === "en";
      document.getElementById("langBtn").textContent = isEn ? "አማርኛ" : "English";
      document.getElementById("subLabel").textContent = isEn ? "Adama & Regional" : "አዳማ እና አካባቢ";
      document.getElementById("postBtn").textContent = isEn ? "+ Post Ad" : "+ ለጥፍ";
      document.getElementById("promoText").textContent = isEn
        ? "📍 Built for Adama, Bishoftu, Mojo, Asella & Shashamane"
        : "📍 ለአዳማ፣ ቢሾፍቱ፣ ሞጆ፣ አሰላ እና ሻሸመኔ ነዋሪዎች የተዘጋጀ";
      document.getElementById("heroTitle").textContent = isEn
        ? "Adama & Regional Marketplace"
        : "የአዳማ እና ክልል ከተሞች ማርኬትፕሌስ";
      document.getElementById("heroDesc").textContent = isEn
        ? "Buy and sell phones, cars, homes, and more. Call sellers directly."
        : "ስልኮች፣ መኪኖች፣ ቤቶች እና ሌሎች እቃዎችን በቀላሉ ይግዙ፣ ይሽጡ እና በቀጥታ ይደውሉ።";
      document.getElementById("searchInput").placeholder = isEn
        ? "Search phones, cars, home items..."
        : "ምን ይፈልጋሉ? (ለምሳሌ፡ iPhone, Corolla, ቤት...)";
      document.getElementById("adsHeading").textContent = isEn ? "Listings" : "ማስታወቂያዎች";
      document.getElementById("navHomeLabel").textContent = isEn ? "Home" : "መነሻ";
      document.getElementById("navPostLabel").textContent = isEn ? "Post" : "ለጥፍ";
      renderAds();
    }

    function renderAds() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const city = document.getElementById("cityFilter").value;
      const sort = document.getElementById("sortFilter").value;
      const grid = document.getElementById("adsGrid");

      let list = ads.filter(item => {
        const matchCity = city === "ALL" || item.city === city;
        const matchCat = activeCat === "ALL" || item.category === activeCat;
        const matchText = !q ||
          item.title.toLowerCase().includes(q) ||
          item.city.toLowerCase().includes(q) ||
          (item.note && item.note.toLowerCase().includes(q));
        return matchCity && matchCat && matchText;
      });

      if (sort === "low") list.sort((a, b) => Number(a.price) - Number(b.price));
      if (sort === "high") list.sort((a, b) => Number(b.price) - Number(a.price));

      document.getElementById("adsCount").textContent =
        lang === "en" ? `${list.length} ads` : `${list.length} ማስታወቂያ`;

      if (list.length === 0) {
        grid.innerHTML = `<div class="card">${lang === "en" ? "No matching ads found." : "ምንም የተገኘ ማስታወቂያ የለም።"}</div>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        const cleanUser = escapeHtml((item.telegram || "").replace(/^@/, "").trim());
        const tgBtn = cleanUser
          ? `<a class="btn-tg" href="https://t.me/${cleanUser}" target="_blank" rel="noopener">Telegram</a>`
          : "";
        return `
          <article class="card">
            <div>
              <div class="card-top">
                <span class="tag">${escapeHtml(item.category)}</span>
                ${item.featured ? `<span class="featured-tag">⭐ ${lang === "en" ? "Featured" : "ተመራጭ"}</span>` : ""}
              </div>
              <div class="ad-title">${escapeHtml(item.title)}</div>
              <div class="ad-price">${Number(item.price).toLocaleString()} ETB</div>
              <div class="ad-meta">📍 ${escapeHtml(item.city)} • 📞 ${escapeHtml(item.phone)}</div>
              ${item.note ? `<div class="ad-meta" style="margin-top:4px;">${escapeHtml(item.note)}</div>` : ""}
            </div>
            <div class="card-actions">
              <a class="btn-call" href="tel:${escapeHtml(item.phone)}">${lang === "en" ? "Call Seller" : "በቀጥታ ይደውሉ"}</a>
              ${tgBtn}
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal() {
      document.getElementById("adModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("adModal").style.display = "none";
    }

    function addAd() {
      const title = document.getElementById("adTitle").value.trim();
      const price = document.getElementById("adPrice").value.trim();
      const category = document.getElementById("adCategory").value;
      const city = document.getElementById("adCity").value;
      const phone = document.getElementById("adPhone").value.trim();
      const telegram = document.getElementById("adTelegram").value.trim();
      const note = document.getElementById("adNote").value.trim();

      if (!title || !price || !phone) {
        alert(lang === "en"
          ? "Please enter title, price, and phone number."
          : "እባክዎ የዕቃውን ስም፣ ዋጋ እና ስልክ ቁጥር ያስገቡ።");
        return;
      }

      ads.unshift({
        id: Date.now(),
        title,
        price: Number(price),
        category,
        city,
        phone,
        telegram,
        note,
        featured: false
      });

      saveAds();
      ["adTitle", "adPrice", "adPhone", "adTelegram", "adNote"].forEach(id => {
        document.getElementById(id).value = "";
      });
      closeModal();
      renderAds();
    }

    renderAds();
  </script>
</body>
</html>
